# Configuration for the STORMM explicit-solvent validation runs on Modal.
#
# Every system listed here ships inside the STORMM repository itself and is already
# equilibrated, which matters because STORMM cannot energy-minimize under periodic
# boundary conditions (apps/Dyna/src/simulator.cpp:297).

[build]
# Pinned so image builds are reproducible. This is main as of 2026-09-03.
commit = "84e97dbd6a37d9ceb2d5a55c269452b5cfb40120"
repo = "https://github.com/Psivant/stormm.git"
# Lovelace. Matches the L40S we run on. Single arch roughly halves nvcc time
# versus the repo Dockerfile's "80;89".
gpu_arch = "89"
cuda_image = "nvidia/cuda:12.4.1-devel-ubuntu22.04"
make_jobs = 4
nvcc_threads = 2

[modal]
gpu = "L40S"
volume = "stormm-runs"
app = "stormm-explicit-solvent"

# ---------------------------------------------------------------------------
# Systems. Atom counts and box dimensions read from the shipped .inpcrd files.
# ---------------------------------------------------------------------------

[systems.jac]
label = "JAC"
topology = "test/Topology/jac.top"
coordinates = "test/Trajectory/jac.inpcrd"
atoms = 23558
box = "61.645 A cube, orthorhombic"
periodic = true
description = "DHFR in TIP3P water, the standard JAC benchmark"

[systems.ubiquitin]
label = "UBI"
topology = "test/Topology/ubiquitin.top"
coordinates = "test/Trajectory/ubiquitin.inpcrd"
atoms = 3105
box = "36.26 A, 109.47 deg truncated octahedron"
periodic = true
description = "Ubiquitin in explicit water"

[systems.tip3p]
label = "TIP3P"
topology = "test/Topology/tip3p.top"
coordinates = "test/Trajectory/tip3p.inpcrd"
atoms = 768
box = "23.37 A, 109.47 deg truncated octahedron"
periodic = true
description = "Pure TIP3P water box; small enough to stress CellGrid::checkViability at a 9 A cutoff"

[systems.tip4p]
label = "TIP4P"
topology = "test/Topology/tip4p.top"
coordinates = "test/Trajectory/tip4p.inpcrd"
atoms = 1024
box = "23.68 A, 109.47 deg truncated octahedron"
periodic = true
description = "4-site water with an off-atom virtual site. Required, not optional: a99SB-disp (Robustelli) is parameterized against TIP4P-D, so virtual sites under PME are a hard prerequisite for that force field"

[systems.gly_arg]
label = "GlyArg"
topology = "test/Namelists/topol/gly_arg.top"
coordinates = "test/Namelists/coord/gly_arg.inpcrd"
atoms = 43
box = "none, isolated boundary conditions"
periodic = false
description = "Gly-Arg dipeptide. The implicit-solvent case AminoAcidTest.sh drives with igb=8; stands in for the IDR-like peptides in the Tsunami workload"

[systems.symmetry_C1]
label = "SymC1"
topology = "test/Topology/symmetry_C1.top"
coordinates = "test/Trajectory/symmetry_C1.inpcrd"
atoms = 22
box = "none, isolated boundary conditions"
periodic = false
description = "Small molecule, dry. Same solute as symmetry_C1_in_water, so the pair gives a same-solute implicit-vs-explicit cost ratio"

[systems.symmetry_C1_in_water]
label = "SymC1Wat"
topology = "test/Topology/symmetry_C1_in_water.top"
coordinates = "test/Trajectory/symmetry_C1_in_water.inpcrd"
atoms = 496
box = "22.87 x 22.31 x 19.84 A, orthorhombic"
periodic = true
description = "The symmetry_C1 solute in explicit water"

# ---------------------------------------------------------------------------
# Shared molecular-mechanics settings.
# ---------------------------------------------------------------------------

[dynamics]
cut = 9.0
dt = 1.0
rigid_geom = "on"
# 2 = Andersen. NOT 3 (Langevin): ntt=3 applies friction with no compensating
# stochastic force and quenches the system toward 0 K. See REQUIREMENTS.md.
thermostat = 2

[pppm]
# theme/order/mesh_ticks confirmed against src/Namelists/nml_pppm.cpp.
# Supplying cut + dsum_tol and omitting ew_coeff makes STORMM derive the Ewald
# coefficient itself, which avoids the conflict branch at nml_pppm.cpp:84.
theme = "electrostatic"
order = 5
mesh_ticks = 4
dsum_tol = 1e-5

# ---------------------------------------------------------------------------
# Phases. Step counts are deliberately short for the first pass.
# ---------------------------------------------------------------------------

[phases.b]
description = "One explicit-solvent simulation on one GPU"
system = "jac"
replicas = 1
nstlim = 10000
ntpr = 500
ntwx = 2000

[phases.c]
description = "10+ small explicit-solvent simulations concurrently on one GPU"
nstlim = 10000
ntpr = 500
ntwx = 5000
# (system, replicas) pairs. The -n 1 controls let us quote the concurrency payoff.
matrix = [
    { system = "ubiquitin", replicas = 1 },
    { system = "ubiquitin", replicas = 12 },
    { system = "tip3p", replicas = 1 },
    { system = "tip3p", replicas = 16 },
    { system = "tip4p", replicas = 1 },
    { system = "tip4p", replicas = 12 },
]

[phases.gb]
description = "Implicit (GB-Neck2, igb=8) vs explicit solvent cost on identical hardware. Motivated by the Tsunami workload, which today generates IDR + small-molecule data in implicit solvent and wants to move to explicit."
nstlim = 10000
ntpr = 500
ntwx = 5000
igb = 8
replicas = 16
matrix = [
    { system = "gly_arg", igb = 8 },
    { system = "symmetry_C1", igb = 8 },
    { system = "symmetry_C1_in_water", igb = 0 },
]
